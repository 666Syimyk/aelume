[project]
name = "hcc-optical-lab"
version = "0.1.0"
description = "HoloCall Cube D0 optical lab: test patterns, Live Portrait, optical compositor, calibration"
requires-python = ">=3.12,<3.13"
# Exact pins live in requirements.lock.txt (generated from the verified venv).
dependencies = [
  "mediapipe==0.10.21",
  "numpy==1.26.4",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
hcc-lab = "hcc_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "camera: needs a physical camera (opt-in: HCC_CAMERA_TESTS=1)",
  "mediapipe: runs the real MediaPipe model (slower)",
]
